{{define "state_history"}}
<div id="tab-panel"{{if .Poll}} hx-get="/projects/{{.ProjectID}}/tabs/state" hx-trigger="every 2s"{{end}} hx-swap="outerHTML">
  {{if .State}}
  <table>
    <thead>
      <tr><th>Serial</th><th>Size</th><th>Updated</th><th>Lock</th></tr>
    </thead>
    <tbody>
      <tr>
        <td>{{.State.Serial}}</td>
        <td>{{.State.Size}}</td>
        <td>{{.State.Time}}</td>
        <td>{{if .State.Locked}}Locked{{else}}Unlocked{{end}}</td>
      </tr>
    </tbody>
  </table>
  {{else}}
  <p class="empty">No stored state.</p>
  {{end}}

  <form method="post" action="/projects/{{.ProjectID}}/state/import" enctype="multipart/form-data" hx-post="/projects/{{.ProjectID}}/state/import" hx-encoding="multipart/form-data" hx-target="#tab-panel" hx-swap="outerHTML">
    <label>Import state file (.tfstate / .json)</label>
    <input type="file" name="state_file" accept=".tfstate,.json,application/json" required>
    <div class="actions">
      <button type="submit">Import state</button>
    </div>
  </form>
</div>
{{end}}
