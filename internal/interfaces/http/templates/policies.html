{{define "policies"}}
<div class="panel form-panel">
  <div class="headline headline-spread form-header">
    <div>
      <h1>Policies</h1>
      <p class="sub">Rego approval and guard policies evaluated against Terraform plans.</p>
    </div>
  </div>

  {{if .Policies}}
  <section class="form-section">
    <h2>Configured Policies</h2>
    <table>
      <thead>
        <tr><th>Name</th><th>Description</th><th>Updated</th></tr>
      </thead>
      <tbody>
        {{range .Policies}}
        <tr>
          <td><a href="/policies/{{.ID}}">{{.Name}}</a></td>
          <td>{{.Description}}</td>
          <td>{{.UpdatedAt}}</td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </section>
  {{end}}

  <section class="form-section">
    <h2>New policy</h2>
    <form method="post" action="/policies">
      <div class="form-grid">
        <div class="field">
          <label for="policy-name">Name</label>
          <input id="policy-name" type="text" name="name" placeholder="e.g. prod-approval" required>
        </div>
        <div class="field">
          <label for="policy-description">Description</label>
          <input id="policy-description" type="text" name="description" placeholder="Optional summary">
        </div>
      </div>
      <div class="field">
        <label for="policy-rego">Rego</label>
        <textarea id="policy-rego" name="rego" rows="12" data-code-editor="rego" required>{{.DefaultRego}}</textarea>
      </div>
      <details>
        <summary>Test input JSON</summary>
        <textarea id="policy-input-json" name="input_json" rows="10" data-code-editor="json">{{.SampleInputJSON}}</textarea>
      </details>
      <div class="actions">
        <button type="submit" class="btn-trigger">Create</button>
        <button type="button" id="btn-test-policy" onclick="runPolicyTest()">Test Policy</button>
      </div>
      <div id="policy-test-result" class="meta"></div>
    </form>
  </section>
</div>

<script>
function setPolicyTestResult(resultEl, pillClass, pillText, detailText) {
  resultEl.textContent = '';
  const pill = document.createElement('span');
  pill.className = 'pill ' + pillClass;
  pill.textContent = pillText;
  resultEl.appendChild(pill);
  if (detailText) {
    resultEl.appendChild(document.createTextNode(' '));
    const detail = document.createElement('span');
    detail.textContent = detailText;
    resultEl.appendChild(detail);
  }
}

async function runPolicyTest() {
  const rego = document.getElementById('policy-rego').value;
  const inputJSON = document.getElementById('policy-input-json').value;
  const resultEl = document.getElementById('policy-test-result');
  resultEl.textContent = 'Evaluating...';
  try {
    const resp = await fetch('/policies/test', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({rego: rego, input_json: inputJSON})
    });
    const data = await resp.json();
    if (data.error) {
      setPolicyTestResult(resultEl, 'pill-failed', 'Error', data.error);
      return;
    }
    const denyText = (data.deny && data.deny.length > 0) ? data.deny.join('; ') : '';
    if (data.allowed) {
      setPolicyTestResult(resultEl, 'pill-finished', 'Allowed', denyText);
    } else if (data.undecided || data.status === 'undecided') {
      setPolicyTestResult(resultEl, 'pill-unconfirmed', 'Undecided', denyText);
    } else {
      setPolicyTestResult(resultEl, 'pill-failed', 'Denied', denyText);
    }
  } catch (err) {
    setPolicyTestResult(resultEl, 'pill-failed', 'Error', String(err));
  }
}
</script>
{{end}}
