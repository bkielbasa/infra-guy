{{define "new_project"}}
<nav class="crumb"><a href="/">Projects</a> / New</nav>
<div class="panel">
  <h1>New project</h1>
  {{if .InstallURL}}
  <p><a href="{{.InstallURL}}">Install GitHub App</a></p>
  {{else}}
  <form method="post" action="/projects">
    <label>Name</label>
    <input type="text" name="name" required>
    <label>Repository</label>
    <select name="repo_id" required>
      {{range .Repos}}<option value="{{.ID}}">{{.Owner}}/{{.Name}}</option>{{end}}
    </select>
    <label>Default branch</label>
    <input type="text" name="branch" value="main">
    <label>Working directory</label>
    <input type="text" name="workdir">
    <label>Terraform version</label>
    <select name="terraform_version">
      {{range .Versions}}<option value="{{.}}"{{if eq . $.DefaultVersion}} selected{{end}}>{{.}}</option>{{end}}
    </select>
    {{if .Contexts}}
    <label>Contexts</label>
    {{range .Contexts}}
    <label class="check"><input type="checkbox" name="context_ids" value="{{.ID}}"> {{.Name}}</label>
    {{end}}
    {{end}}
    <label class="check"><input type="checkbox" name="auto_approve"> Auto-approve</label>
    <div class="actions">
      <button type="submit">Create</button>
    </div>
  </form>
  {{end}}
</div>
{{end}}
