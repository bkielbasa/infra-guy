{{define "details"}}
<nav class="crumb"><a href="/">Projects</a> / <a href="/projects/{{.ID}}">{{.Name}}</a> / Settings</nav>
<div class="panel">
  <h1>Settings</h1>
  <form method="post" action="/projects/{{.ID}}">
    <label class="check"><input type="checkbox" name="auto_approve"{{if .AutoApprove}} checked{{end}}> Auto-approve</label>
    <label>Default branch</label>
    <input type="text" name="branch" value="{{.Branch}}">
    <label>Working directory</label>
    <input type="text" name="workdir" value="{{.Workdir}}">
    <label>Terraform version</label>
    <select name="terraform_version">
      {{range .Versions}}<option value="{{.}}"{{if eq . $.TerraformVersion}} selected{{end}}>{{.}}</option>{{end}}
    </select>
    {{if .Contexts}}
    <label>Contexts</label>
    {{range .Contexts}}
    <label class="check"><input type="checkbox" name="context_ids" value="{{.ID}}"{{if .Attached}} checked{{end}}> {{.Name}}</label>
    {{end}}
    {{end}}
    <label>Approval policy</label>
    <select name="approval_policy_id">
      <option value="">None</option>
      {{range .Policies}}<option value="{{.ID}}"{{if .Selected}} selected{{end}}>{{.Name}}</option>{{end}}
    </select>
    <div class="actions">
      <button type="submit">Save</button>
    </div>
  </form>
  <form method="post" action="/projects/{{.ID}}/force-unlock" class="inline">
    <button type="submit">Force-unlock state</button>
  </form>
  <form method="post" action="/projects/{{.ID}}/delete" class="inline">
    <button type="submit" class="btn-danger">Delete project</button>
  </form>
</div>
{{end}}
